# ============================================================
# 乡野智游 —— 站点主配置（域名 + IP 并存）
# 部署位置：/etc/nginx/sites-available/rural-travel
# 更新：2026-11-25
#
# 说明：
#   1. 80 端口同时接受域名与 IP 访问，未备案期间用 IP 照常可用
#   2. 8080 端口专供备案前验证域名解析是否生效（备案通过后由
#      enable-https.sh 自动删除该段，再走 certbot 签发证书）
#   3. 通用 location 规则抽到 snippets/rural-travel-common.conf
# ============================================================

# ---------------- 主站：80 端口 ----------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xiangyezhiyou.cn www.xiangyezhiyou.cn _;

    root /opt/rural-travel/www;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 12m;

    access_log /var/log/nginx/rural-travel.access.log;
    error_log  /var/log/nginx/rural-travel.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/rural-travel-common.conf;
}

# >>> pre-filing-8080 >>>
# ---------------- 备案前自测：8080 端口 ----------------
# 国内节点未备案时 80 端口会被云厂商拦截，非标端口不受影响。
# 域名解析加好后可用 http://xiangyezhiyou.cn:8080 验证全链路是否就绪，
# 不必等备案通过。备案完成后执行 enable-https.sh 会自动删除本段。
server {
    listen 8080;
    listen [::]:8080;
    server_name xiangyezhiyou.cn www.xiangyezhiyou.cn;

    root /opt/rural-travel/www;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 12m;

    access_log /var/log/nginx/rural-travel.access.log;
    error_log  /var/log/nginx/rural-travel.error.log warn;

    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/rural-travel-common.conf;
}
# <<< pre-filing-8080 <<<
