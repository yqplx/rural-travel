# ============================================================
# 乡野智游 —— 站点通用规则（被多个 server 块共用）
# 部署位置：/etc/nginx/snippets/rural-travel-common.conf
# 更新：2026-11-25（加入域名支持与登录限流）
# ============================================================

# ---------- 登录/注册接口：限流防暴力破解 ----------
# 站点公网可访问且登录接口无失败锁定，这里在网关层兜一层
location /api/auth/ {
    limit_req zone=rural_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# ---------- 业务接口反代 ----------
location /api/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

# ---------- 静态资源缓存 ----------
location /assets/  { expires 30d; access_log off; }
location /images/  { expires 7d;  access_log off; try_files $uri =404; }
location /cesium/  { expires 30d; access_log off; }
location = /favicon.ico { access_log off; log_not_found off; expires 7d; }

# ---------- 禁止访问隐藏文件（保留 ACME 校验目录）----------
location ~ /\.(?!well-known) { deny all; }

# ---------- SPA 回退（路由是 history 模式，刷新必须回 index.html）----------
location / {
    try_files $uri $uri/ /index.html;
}
