# ============================================================================
# Nginx 站点配置 · 乡野智游
# 放置：/etc/nginx/conf.d/rural-travel.conf（或 sites-available + 软链）
# 生效：sudo nginx -t && sudo systemctl reload nginx
#
# 设计要点：
#  1) 前端 axios 的 baseURL 是相对路径 /api，必须同域反代，不能拆成两个域名
#  2) 路由是 createWebHistory，必须有 try_files 回退，否则刷新 /bigscreen 就 404
#  3) 后端只监听 127.0.0.1:8091，公网流量一律经这里
# ============================================================================

upstream rural_backend {
    server 127.0.0.1:8091;
    keepalive 32;
}

# ---------- HTTP：仅用于跳转 HTTPS 与证书续期 ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Let's Encrypt 续期校验放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 前端构建产物（deploy.sh 切换的软链）
    root /opt/rural-travel/www;
    index index.html;

    # 识景上传是 10MB 以内，留一点余量；与后端 multipart 上限对齐
    client_max_body_size 12m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/wasm;

    # ---- 接口反代 ----
    location /api/ {
        proxy_pass http://rural_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 兼容后续可能的 SSE/WebSocket；普通请求时 $http_upgrade 为空
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # 后端 AI 调用超时 20s，这里留足余量
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # ---- 静态资源缓存 ----
    # 文件名带 hash，可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cesium 运行时资源（约 13MB），变化少但非 hash 命名
    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 景区图片（87MB），量大人少变
    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- SPA 路由回退（必须有）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后立即拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}

